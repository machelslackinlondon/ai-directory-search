<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Directory Search</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local directory</p>
          <h1>AI Directory Search</h1>
        </div>
        <nav class="tabs" aria-label="Views">
          <button class="tab active" data-view="search" type="button">Search</button>
          <button class="tab" data-view="admin" type="button">Admin</button>
        </nav>
      </header>

      <section class="search-view" id="search-view">
        <section class="command-band" aria-label="Search controls">
          <div class="search-box">
            <label for="search-input">Search</label>
            <input id="search-input" type="search" placeholder="Find an expert or project need">
          </div>
          <div class="agent-box">
            <label for="agent-input">Ask</label>
            <div class="input-row">
              <input id="agent-input" type="text" placeholder="Who can help with AI vendor risk?">
              <button id="agent-button" type="button">Ask</button>
            </div>
            <div id="agent-inline-answer" class="agent-inline" aria-live="polite"></div>
          </div>
        </section>

        <section class="directory-filters" aria-label="Directory filters">
          <div class="primary-filter-row">
            <label for="business-type-filter">
              Business Type
              <select id="business-type-filter">
                <option value="">All business types</option>
              </select>
            </label>
            <label for="category-filter">
              Category
              <select id="category-filter">
                <option value="">All categories</option>
              </select>
            </label>
            <label for="state-filter">
              State
              <select id="state-filter">
                <option value="">All states</option>
              </select>
            </label>
            <button id="search-button" class="primary" type="button">Search</button>
          </div>
          <button id="more-filters-toggle" class="more-filters-toggle" type="button" aria-expanded="false" aria-controls="more-filters-panel">
            <span>More filters</span>
            <span>Rooms, project type, style and services</span>
          </button>
          <section id="more-filters-panel" hidden>
            <div class="facet-grid">
              <fieldset>
                <legend>Rooms</legend>
                <div data-facet-options="rooms"></div>
              </fieldset>
              <fieldset>
                <legend>Project Type</legend>
                <div data-facet-options="projectTypes"></div>
              </fieldset>
              <fieldset>
                <legend>Style</legend>
                <div data-facet-options="styles"></div>
              </fieldset>
              <fieldset>
                <legend>Services</legend>
                <div data-facet-options="services"></div>
              </fieldset>
            </div>
            <div class="filter-actions">
              <button id="clear-filters" class="ghost" type="button">Clear All</button>
              <button id="apply-filters" class="primary" type="button">Apply Filters</button>
            </div>
          </section>
        </section>

        <section class="workbench">
          <aside class="filters" aria-label="Filters">
            <label>
              Sort
              <select id="sort-control">
                <option value="relevance">Relevance</option>
                <option value="name">Name</option>
                <option value="newest">Newest</option>
                <option value="updated">Recently updated</option>
                <option value="category">Category</option>
              </select>
            </label>
            <label>
              Mode
              <select id="mode-control">
                <option value="keyword">Keyword</option>
                <option value="hybrid">Hybrid</option>
                <option value="semantic">Semantic</option>
              </select>
            </label>
            <section class="interaction-log" aria-label="Activity log">
              <div class="interaction-log__head">
                <span>Activity</span>
                <button id="clear-log-button" class="ghost" type="button">Clear</button>
              </div>
              <ol id="activity-log" aria-live="polite"></ol>
            </section>
          </aside>

          <section class="results-column" aria-label="Results">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Ranked results</p>
                <h2 id="result-count" aria-live="polite">0 entries</h2>
              </div>
              <button id="clear-button" class="ghost" type="button">Clear</button>
            </div>
            <div id="applied-filter-chips" class="applied-filter-chips" aria-live="polite"></div>
            <div id="results" class="results-list" aria-live="polite"></div>
          </section>

          <aside class="detail-column" aria-label="Detail view">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Record</p>
                <h2>Detail</h2>
              </div>
            </div>
            <div id="detail" aria-live="polite"></div>
            <div class="agent-panel">
              <div class="panel-head compact">
                <div>
                  <p class="eyebrow">Agent</p>
                  <h2>Answer</h2>
                </div>
              </div>
              <div id="agent-answer"></div>
            </div>
          </aside>
        </section>
      </section>

      <section class="admin-view hidden" id="admin-view">
        <section class="admin-grid">
          <div class="admin-import">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Admin</p>
                <h2>Import</h2>
              </div>
              <button id="reindex-button" type="button">Reindex</button>
            </div>
            <div class="admin-controls">
              <label>
                Format
                <select id="import-format">
                  <option value="json">JSON</option>
                  <option value="csv">CSV</option>
                </select>
              </label>
              <label>
                Mode
                <select id="import-mode">
                  <option value="upsert">Upsert</option>
                  <option value="replace">Replace</option>
                </select>
              </label>
              <label>
                Token
                <input id="admin-token" type="password" autocomplete="current-password" placeholder="Admin token">
              </label>
            </div>
            <textarea id="import-content" spellcheck="false" placeholder='{"entries":[{"name":"Example","description":"A searchable entry","category":"tools","tags":["search"]}]}'></textarea>
            <div class="input-row">
              <input id="import-file" type="file" accept=".json,.csv,application/json,text/csv">
              <button id="import-button" class="primary" type="button">Import</button>
            </div>
            <div id="admin-status" aria-live="polite"></div>
          </div>
          <div class="stats-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Index</p>
                <h2>Stats</h2>
              </div>
            </div>
            <pre id="stats-output"></pre>
          </div>
        </section>
      </section>
    </main>
    <script src="/renderers.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
